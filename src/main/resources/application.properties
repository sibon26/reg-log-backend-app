spring.application.name=auth-backend

# ─────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────
# Database
# Defaults to in-memory H2 (MySQL mode) for zero-setup execution.
# To connect to MySQL, set DB_URL, DB_USERNAME, DB_PASSWORD in .env or environment variables.
# ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# ─────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ─────────────────────────────────────────────────────────────────
# JWT Cookie Authentication
# ─────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIEpXVCB0b2tlbiBnZW5lcmF0aW9u}
# 30 minutes in milliseconds
jwt.expiration=${JWT_EXPIRATION_MS:1800000}
jwt.cookie.name=${JWT_COOKIE_NAME:access-token}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

# ─────────────────────────────────────────────────────────────────
# CORS
# ─────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─────────────────────────────────────────────────────────────────
# Spring Mail (Brevo SMTP / configurable)
# ─────────────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@secureauth.dev}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000
# Set to false to allow app to start without SMTP credentials
mail.enabled=${MAIL_ENABLED:false}

# ─────────────────────────────────────────────────────────────────
# OTP Configuration
# ─────────────────────────────────────────────────────────────────
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# ─────────────────────────────────────────────────────────────────
# Logging (never log tokens or passwords)
# ─────────────────────────────────────────────────────────────────
logging.level.com.auth.backend=INFO
logging.level.org.springframework.security=WARN
